<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Входящ Контрол - Склад</title>
    <!-- Библиотека за експорт към Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { margin-bottom: 8px; color: #1a202c; }
        p { color: #4a5568; font-size: 14px; margin-bottom: 15px; }
        
        .api-input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 13px;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn {
            border: none;
            color: white;
            background-color: #0d47a1;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        .btn-excel {
            background-color: #2e7d32;
            margin-top: 15px;
        }
        .btn-danger {
            background-color: #c62828;
            font-size: 12px;
            padding: 6px 12px;
            margin-top: 10px;
            width: auto;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #2b6cb0;
        }
        #preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .archive-section {
            margin-top: 25px;
            text-align: left;
            width: 100%;
        }
        .table-wrapper {
            overflow-x: auto;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #edf2f7;
            color: #2d3748;
        }
        tr:nth-child(even) { background-color: #f7fafc; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Входящ Контрол & Архив</h2>
    <p>Въведете Вашия Google API ключ:</p>
    <input type="password" id="userApiKey" class="api-input" placeholder="Поставете ключа (AIza...) тук">

    <p>Снимайте стокова разписка или етикет:</p>
    <div class="upload-btn-wrapper">
        <button class="btn">📸 Снимай / Избери файл</button>
        <input type="file" id="imageInput" accept="image/*" capture="environment">
    </div>

    <img id="preview" alt="Преглед">
    <div id="status"></div>

    <hr style="margin-top:25px; border:0; border-top:1px solid #e2e8f0;">

    <div class="archive-section">
        <h3>📋 Архив на сканираните артикули</h3>
        
        <button id="exportBtn" class="btn btn-excel">📥 Изтегли в Excel (.xlsx)</button>
        
        <div class="table-wrapper">
            <table id="archiveTable">
                <thead>
                    <tr>
                        <th>Дата/Час</th>
                        <th>Продукт</th>
                        <th>Количество</th>
                        <th>Партида</th>
                        <th>Срок на годност</th>
                    </tr>
                </thead>
                <tbody id="archiveBody">
                </tbody>
            </table>
        </div>
        
        <button id="clearBtn" class="btn btn-danger">🗑️ Изчисти архива</button>
    </div>
</div>

 <script>
    var userApiKeyInput = document.getElementById('userApiKey');
    var imageInput = document.getElementById('imageInput');
    var preview = document.getElementById('preview');
    var statusDiv = document.getElementById('status');
    var archiveBody = document.getElementById('archiveBody');
    var exportBtn = document.getElementById('exportBtn');
    var clearBtn = document.getElementById('clearBtn');

    if (localStorage.getItem('gemini_api_key')) {
        userApiKeyInput.value = localStorage.getItem('gemini_api_key');
    }
    userApiKeyInput.addEventListener('change', function() {
        localStorage.setItem('gemini_api_key', userApiKeyInput.value.trim());
    });

    var archiveData = JSON.parse(localStorage.getItem('scan_archive') || '[]');
    renderArchive();

    imageInput.addEventListener('change', async function(e) {
        var apiKey = userApiKeyInput.value.trim();
        if (!apiKey) {
            alert("Моля, въведете API ключ най-горе!");
            return;
        }

        var file = e.target.files[0];
        if (!file) return;

        preview.src = URL.createObjectURL(file);
        preview.style.display = 'inline-block';
        statusDiv.innerText = "⏳ Обработка...";

        try {
            var base64Image = await fileToBase64(file);

            var promptText = "Извлечи ВСЕКИ отделен продукт от снимката. Върни СТРИКТНО JSON обект с ключ \"items\" съдържащ масив от продукти без друг текст: {\"items\": [{\"product_name\": \"Име\", \"quantity\": \"Количество\", \"batch_number\": \"Партида или N/A\", \"expiry_date\": \"Срок или N/A\"}]}";

            // Използваме стабилния модел gemini-2.5-flash
            var response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inlineData: { mimeType: file.type || "image/jpeg", data: base64Image } }
                        ]
                    }]
                })
            });

            var data = await response.json();

            if (!response.ok) {
                throw new Error(data.error ? data.error.message : "Грешка при заявката");
            }

            var text = data.candidates[0].content.parts[0].text;
            text = text.replace(/```json/g, "").replace(/```/g, "").trim();
            var parsedJson = JSON.parse(text);

            if (parsedJson && parsedJson.items && Array.isArray(parsedJson.items)) {
                var now = new Date().toLocaleString("bg-BG");
                
                parsedJson.items.forEach(function(item) {
                    archiveData.unshift({
                        timestamp: now,
                        product_name: item.product_name || "Неизвестен",
                        quantity: item.quantity || "",
                        batch_number: item.batch_number || "N/A",
                        expiry_date: item.expiry_date || "N/A"
                    });
                });

                localStorage.setItem("scan_archive", JSON.stringify(archiveData));
                renderArchive();
                statusDiv.innerText = "✅ Добавени са " + parsedJson.items.length + " артикула!";
            } else {
                throw new Error("Форматът на отговора е невалиден.");
            }

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "❌ Грешка: " + error.message;
        }
    });

    function renderArchive() {
        archiveBody.innerHTML = "";
        archiveData.forEach(function(item) {
            var tr = document.createElement("tr");
            tr.innerHTML = "<td>" + item.timestamp + "</td>" +
                "<td><strong>" + item.product_name + "</strong></td>" +
                "<td>" + item.quantity + "</td>" +
                "<td>" + item.batch_number + "</td>" +
                "<td>" + item.expiry_date + "</td>";
            archiveBody.appendChild(tr);
        });
    }

    exportBtn.addEventListener('click', function() {
        if (archiveData.length === 0) {
            alert("Архивът е празен!");
            return;
        }

        var worksheetData = archiveData.map(function(item) {
            return {
                "Дата/Час": item.timestamp,
                "Продукт": item.product_name,
                "Количество": item.quantity,
                "Партида": item.batch_number,
                "Срок на годност": item.expiry_date
            };
        });

        var worksheet = XLSX.utils.json_to_sheet(worksheetData);
        var workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Входящ Контрол");

        var fileName = "Vhodasht_Kontrol_" + new Date().toISOString().slice(0, 10) + ".xlsx";
        XLSX.writeFile(workbook, fileName);
    });

    clearBtn.addEventListener('click', function() {
        if (confirm("Изчистване на архива?")) {
            archiveData = [];
            localStorage.removeItem("scan_archive");
            renderArchive();
        }
    });

    function fileToBase64(file) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function() { resolve(reader.result.split(',')[1]); };
            reader.onerror = function(error) { reject(error); };
            reader.readAsDataURL(file);
        });
    }
</script>


</body>
</html>
