<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Входящ Контрол</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 { margin-bottom: 8px; color: #1a202c; }
        p { color: #4a5568; font-size: 14px; margin-bottom: 20px; }
        
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .btn {
            border: none;
            color: white;
            background-color: #0d47a1;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #2b6cb0;
        }
        #preview {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        #result-box {
            margin-top: 20px;
            text-align: left;
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-size: 13px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Входящ Контрол</h2>
    <p>Снимайте стоковата разписка, фактурата или етикета на продукта.</p>

    <div class="upload-btn-wrapper">
        <button class="btn">📸 Снимай / Избери файл</button>
        <input type="file" id="imageInput" accept="image/*" capture="environment">
    </div>

    <img id="preview" alt="Преглед">
    <div id="status"></div>
    <div id="result-box"></div>
</div>

<script>
    // Поставете Вашия Google API ключ тук:
    const apiKey = "AIzaSyD...";

    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const statusDiv = document.getElementById('status');
    const resultBox = document.getElementById('result-box');

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        resultBox.style.display = 'none';
        statusDiv.innerText = "⏳ Обработка и изпращане към Google AI...";

        try {
            const base64Image = await fileToBase64(file);

            // Ползваме бързия и олекотен модел gemini-3.5-flash-lite
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "Извлечи целия текст от тази снимка/документ точка по точка." },
                            { inlineData: { mimeType: file.type || "image/jpeg", data: base64Image } }
                        ]
                    }]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || "Грешка от сървъра на Google");
            }

            const textResult = data.candidates?.[0]?.content?.parts?.[0]?.text;
            statusDiv.innerText = "✅ Разчитането завърши!";
            resultBox.innerText = textResult || "Не бе намерен текст.";
            resultBox.style.display = 'block';

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "❌ " + error.message;
        }
    });

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }
</script>

</body>
</html>
