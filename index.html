<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Входящ Контрол - Сканиране</title>
    <!-- Библиотека за OCR сканиране директно в браузъра (офлайн/без лимити) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 { margin-bottom: 8px; color: #1a202c; }
        p { color: #4a5568; font-size: 14px; margin-bottom: 20px; }
        
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .btn {
            border: none;
            color: white;
            background-color: #0d47a1;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #002171; }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #2b6cb0;
        }
        #preview {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        #result-box {
            margin-top: 20px;
            text-align: left;
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>

    <p>Снимайте стоковата разписка, фактурата или етикета на продукта.</p>

    <div class="upload-btn-wrapper">
        <button class="btn">📸 Снимай / Избери файл</button>
        <input type="file" id="imageInput" accept="image/*" capture="environment">
    </div>

    <img id="preview" alt="Преглед на снимката">
    <div id="status"></div>
    <div id="result-box"></div>
</div>
