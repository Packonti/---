<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Входящ Контрол - Склад</title>
    <!-- Библиотека за генериране на истински Excel файлове (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { margin-bottom: 8px; color: #1a202c; }
        p { color: #4a5568; font-size: 14px; margin-bottom: 15px; }
        
        .api-input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 13px;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn {
            border: none;
            color: white;
            background-color: #0d47a1;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        .btn-excel {
            background-color: #2e7d32;
            margin-top: 15px;
        }
        .btn-danger {
            background-color: #c62828;
            font-size: 12px;
            padding: 6px 12px;
            margin-top: 10px;
            width: auto;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #2b6cb0;
        }
        #preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        
        /* Таблица за архива */
        .archive-section {
            margin-top: 30px;
            text-align: left;
            width: 100%;
        }
        .table-wrapper {
            overflow-x: auto;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #edf2f7;
            color: #2d3748;
        }
        tr:nth-child(even) { background-color: #f7fafc; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Входящ Контрол & Архив</h2>
    <p>Въведете Вашия Google API ключ:</p>
    <input type="password" id="userApiKey" class="api-input" placeholder="Поставете ключа (AIza...) тук">

    <p>Снимайте стокова разписка или етикет:</p>
    <div class="upload-btn-wrapper">
        <button class="btn">📸 Снимай / Избери файл</button>
        <input type="file" id="imageInput" accept="image/*" capture="environment">
    </div>

    <img id="preview" alt="Преглед">
    <div id="status"></div>

    <hr style="margin-top:25px; border:0; border-top:1px solid #e2e8f0;">

    <!-- Секция Архив -->
    <div class="archive-section">
        <h3>📋 Архив на сканираните продукти</h3>
        
        <button id="exportBtn" class="btn btn-excel">📥 Изтегли в Excel (.xlsx)</button>
        
        <div class="table-wrapper">
            <table id="archiveTable">
                <thead>
                    <tr>
                        <th>Дата/Час</th>
                        <th>Продукт</th>
                        <th>Партида</th>
                        <th>Срок на годност</th>
                        <th>Съставки/Детайли</th>
                    </tr>
                </thead>
                <tbody id="archiveBody">
                    <!-- Записите се зареждат тук -->
                </tbody>
            </table>
        </div>
        
        <button id="clearBtn" class="btn btn-danger">🗑️ Изчисти архива</button>
    </div>
</div>

<script>
    const userApiKeyInput = document.getElementById('userApiKey');
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const statusDiv = document.getElementById('status');
    const archiveBody = document.getElementById('archiveBody');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');

    // Пазим API ключа
    if (localStorage.getItem('gemini_api_key')) {
        userApiKeyInput.value = localStorage.getItem('gemini_api_key');
    }
    userApiKeyInput.addEventListener('change', () => {
        localStorage.setItem('gemini_api_key', userApiKeyInput.value.trim());
    });

    // Зареждане на архива при отваряне
    let archiveData = JSON.parse(localStorage.getItem('scan_archive') || '[]');
    renderArchive();

    imageInput.addEventListener('change', async (e) => {
        const apiKey = userApiKeyInput.value.trim();
        if (!apiKey) {
            alert("Моля, въведете API ключ най-горе!");
            return;
        }

        const file = e.target.files[0];
        if (!file) return;

        preview.src = URL.createObjectURL(file);
        preview.style.display = 'inline-block';
        statusDiv.innerText = "⏳ Анализиране и структуриране на данните...";

        try {
            const base64Image = await fileToBase64(file);
            const models = ['gemini-3.8-flash', 'gemini-2.0-flash-exp', 'gemini-1.5-flash'];
            let parsedJson = null;
            let lastError = null;

            // Специални указания към AI да върне чист JSON за Excel
            const prompt = `Извлечи данните от снимката и ги върни СТРИКТНО в следния JSON формат без допълнителен текст или markdown:
            {
              "product_name": "Име на продукта",
              "batch_number": "Номер на партида (ако има, иначе N/A)",
              "expiry_date": "Срок на годност (ако има, иначе N/A)",
              "details": "Кратко описание или основни съставки"
            }`;

            for (const model of models) {
                try {
                    statusDiv.innerText = `⏳ Сканиране с ${model}...`;
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: file.type || "image/jpeg", data: base64Image } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
                        let text = data.candidates[0].content.parts[0].text;
                        text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                        parsedJson = JSON.parse(text);
                        break;
                    } else {
                        lastError = data.error?.message || "Грешка от сървъра";
                    }
                } catch (err) {
                    lastError = err.message;
                }
            }

            if (parsedJson) {
                statusDiv.innerText = "✅ Добавено в архива!";
                
                // Добавяме нов запис
                const newRecord = {
                    timestamp: new Date().toLocaleString('bg-BG'),
                    product_name: parsedJson.product_name || 'Неизвестен',
                    batch_number: parsedJson.batch_number || 'N/A',
                    expiry_date: parsedJson.expiry_date || 'N/A',
                    details: parsedJson.details || ''
                };

                archiveData.unshift(newRecord); // Добавя най-горе
                localStorage.setItem('scan_archive', JSON.stringify(archiveData));
                renderArchive();

            } else {
                throw new Error(lastError || "Не можа да се разчете документът.");
            }

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "❌ Грешка: " + error.message;
        }
    });

    // Показване на архива в таблицата
    function renderArchive() {
        archiveBody.innerHTML = '';
        archiveData.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.timestamp}</td>
                <td><strong>${item.product_name}</strong></td>
                <td>${item.batch_number}</td>
                <td>${item.expiry_date}</td>
                <td>${item.details}</td>
            `;
            archiveBody.appendChild(tr);
        });
    }

    // Сваляне в Excel (.xlsx)
    exportBtn.addEventListener('click', () => {
        if (archiveData.length === 0) {
            alert("Архивът е празен!");
            return;
        }

        const worksheetData = archiveData.map(item => ({
            "Дата/Час": item.timestamp,
            "Продукт": item.product_name,
            "Партида": item.batch_number,
            "Срок на годност": item.expiry_date,
            "Съставки / Детайли": item.details
        }));

        const worksheet = XLSX.utils.json_to_sheet(worksheetData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Входящ Контрол");

        // Генерира име на файла с днешна дата
        const fileName = `Vhodasht_Kontrol_${new Date().toISOString().slice(0,10)}.xlsx`;
        XLSX.writeFile(workbook, fileName);
    });

    // Изчистване на архива
    clearBtn.addEventListener('click', () => {
        if (confirm("Сигурни ли сте, че искате да изчистите архива?")) {
            archiveData = [];
            localStorage.removeItem('scan_archive');
            renderArchive();
        }
    });

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }
</script>

</body>
</html>
